<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg:#e9f0f7;--board:#27405c;--cell:#385675;--text:#12253a;--muted:#4f6a86;--btn:#ff6b57;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1623;--board:#1b2c44;--cell:#26405f;--text:#e6eefb;--muted:#8ea6c4;--btn:#ff6b57;--btnt:#fff}}
:root[data-theme="dark"]{--bg:#0d1623;--board:#1b2c44;--cell:#26405f;--text:#e6eefb;--muted:#8ea6c4;--btn:#ff6b57;--btnt:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{width:min(92vw,440px,calc(100dvh - 150px));min-width:260px;padding:16px 0}
header{display:flex;align-items:stretch;gap:8px;margin-bottom:14px}
.score{flex:1;background:var(--board);color:#fff;border-radius:12px;padding:6px 10px;text-align:center}
.score small{display:block;font-size:12px;opacity:.75}
.score b{font-size:22px}
button{background:var(--btn);color:var(--btnt);border:0;border-radius:12px;padding:0 18px;min-height:48px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
button:focus-visible{outline:3px solid #e0a030;outline-offset:2px}
#board{position:relative;background:var(--board);border-radius:10px;padding:10px;aspect-ratio:1;width:100%}
.grid,.tiles{position:absolute;inset:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
.grid div{background:var(--cell);border-radius:6px;opacity:.55}
.tile{position:absolute;width:calc((100% - 30px)/4);height:calc((100% - 30px)/4);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(22px,8vw,38px);transition:transform .12s ease}
.tile.new{animation:pop .15s ease}
.tile.merged{animation:bump .15s ease}
@keyframes pop{from{scale:.4;opacity:0}to{scale:1;opacity:1}}
@keyframes bump{50%{scale:1.15}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.new,.tile.merged{animation:none}}
#msg{position:absolute;inset:0;border-radius:10px;background:rgba(13,22,35,.82);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:32px;font-weight:700;z-index:5}
#msg.show{display:flex}
#msg button{background:#ff6b57;color:#fff}
.t2{background:#d9f4ee;color:#1b5e56}.t4{background:#a8ebdd;color:#1b5e56}.t8{background:#5fd6c2;color:#08423b}.t16{background:#2ec4b6;color:#fff}
.t32{background:#3a9bdc;color:#fff}.t64{background:#4c6fe0;color:#fff}.t128{background:#7a5af0;color:#fff;font-size:clamp(20px,7vw,32px)}
.t256{background:#a23fe0;color:#fff;font-size:clamp(20px,7vw,32px)}.t512{background:#d63aa8;color:#fff;font-size:clamp(20px,7vw,32px)}
.t1024{background:#ff5a7a;color:#fff;font-size:clamp(16px,5.5vw,26px)}.t2048{background:#ffb703;color:#3b2a00;font-size:clamp(16px,5.5vw,26px)}
.tbig{background:#111;color:#ffb703;font-size:clamp(14px,5vw,24px)}
footer{margin-top:14px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="score"><small>Score</small><b id="score">0</b></div>
    <div class="score"><small>Best</small><b id="best">0</b></div>
    <button id="new">New game</button>
  </header>
  <div id="board">
    <div class="grid"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="tiles" id="tiles"></div>
    <div id="msg"><span id="msgt"></span><button id="again">Try again</button></div>
  </div>
</div>
<script>
(function(){
var N=4,grid,score,best=0,won=false,over=false,nextId=1;
var tilesEl=document.getElementById('tiles'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
var msg=document.getElementById('msg'),msgt=document.getElementById('msgt');
try{best=parseInt(localStorage.getItem('best2048'),10)||0}catch(e){}
function empty(){var g=[];for(var r=0;r<N;r++){g.push([null,null,null,null])}return g}
function addTile(){
  var cells=[];
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!grid[r][c])cells.push([r,c]);
  if(!cells.length)return;
  var p=cells[Math.floor(Math.random()*cells.length)];
  grid[p[0]][p[1]]={id:nextId++,v:Math.random()<0.9?2:4,isNew:true};
}
function start(){
  grid=empty();score=0;won=false;over=false;tilesEl.innerHTML='';
  msg.classList.remove('show');addTile();addTile();render();
}
function cls(v){return 't'+(v>2048?'big':v)}
var els={};
function render(){
  var seen={};
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var t=grid[r][c];if(!t)continue;
    seen[t.id]=1;
    var el=els[t.id];
    if(!el){el=document.createElement('div');el.dataset.id=t.id;tilesEl.appendChild(el);els[t.id]=el}
    el.className='tile '+cls(t.v)+(t.isNew?' new':'')+(t.merged?' merged':'');
    el.textContent=t.v;
    el.style.left=(c*25)+'%';el.style.top=(r*25)+'%';
    // offset for gaps: shift each cell by its share of the 10px gaps
    el.style.transform='translate('+(c*(-7.5)+c*0)+'px,'+(r*(-7.5)+r*0)+'px)';
    el.style.left='calc('+c+' * (((100% - 30px)/4) + 10px))';
    el.style.top='calc('+r+' * (((100% - 30px)/4) + 10px))';
    el.style.transform='';
    t.isNew=false;t.merged=false;
  }
  for(var id in els){if(!seen[id]){els[id].remove();delete els[id]}}
  scoreEl.textContent=score;
  if(score>best){best=score;try{localStorage.setItem('best2048',best)}catch(e){}}
  bestEl.textContent=best;
}
function line(arr){
  var t=arr.filter(Boolean),out=[],gain=0;
  for(var i=0;i<t.length;i++){
    if(t[i+1]&&t[i].v===t[i+1].v){
      var m={id:t[i].id,v:t[i].v*2,merged:true};
      // drop the consumed tile so it disappears
      gain+=m.v;out.push(m);i++;
    }else out.push(t[i]);
  }
  while(out.length<N)out.push(null);
  return{out:out,gain:gain};
}
function move(dir){
  if(over)return;
  var moved=false,gained=0;
  for(var i=0;i<N;i++){
    var arr=[];
    for(var j=0;j<N;j++){
      arr.push(dir==='left'?grid[i][j]:dir==='right'?grid[i][N-1-j]:dir==='up'?grid[j][i]:grid[N-1-j][i]);
    }
    var res=line(arr);gained+=res.gain;
    for(var j=0;j<N;j++){
      var nt=res.out[j];
      var r,c;
      if(dir==='left'){r=i;c=j}else if(dir==='right'){r=i;c=N-1-j}else if(dir==='up'){r=j;c=i}else{r=N-1-j;c=i}
      if(grid[r][c]!==nt)moved=true;
      grid[r][c]=nt;
    }
  }
  if(!moved)return;
  score+=gained;addTile();render();check();
}
function canMove(){
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    if(!grid[r][c])return true;
    if(c<N-1&&grid[r][c+1]&&grid[r][c].v===grid[r][c+1].v)return true;
    if(r<N-1&&grid[r+1][c]&&grid[r][c].v===grid[r+1][c].v)return true;
  }
  return false;
}
function check(){
  if(!won){for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(grid[r][c]&&grid[r][c].v>=2048){won=true;msgt.textContent='You reached 2048!';document.getElementById('again').textContent='Keep playing';msg.classList.add('show');msg.dataset.mode='win';return}}
  if(!canMove()){over=true;msgt.textContent='No moves left';document.getElementById('again').textContent='Try again';msg.dataset.mode='over';msg.classList.add('show')}
}
document.getElementById('again').onclick=function(){
  if(msg.dataset.mode==='win'){msg.classList.remove('show')}else start();
};
document.getElementById('new').onclick=start;
document.addEventListener('keydown',function(e){
  var k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'}[e.key];
  if(k){e.preventDefault();move(k)}
});
var sx,sy,board=document.getElementById('board');
board.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
board.addEventListener('touchend',function(e){
  if(sx==null)return;
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));sx=null;
},{passive:true});
start();
})();
</script>
</body>
</html>
